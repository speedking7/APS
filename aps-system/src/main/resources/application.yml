server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/aps_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: true   # 确保 JPA 建表后再执行 schema.sql
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}   # Docker 启动时由环境变量设为 always
      data-locations: classpath:schema.sql
      continue-on-error: true               # 重复数据插入失败时忽略
