<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>APS · 计划结果</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=satoshi:400,500,700,900|instrument-sans:400,500,600|geist:400,500,600,700&display=swap" rel="stylesheet"/>
<style>
:root{--color-primary:#0057b8;--color-secondary:#FF6B35;--color-accent:#00875A;--color-neutral-050:#f1f2f3;--color-neutral-100:#fafbfc;--color-neutral-200:#c1c6c8;--color-neutral-400:#8A96A8;--color-neutral-600:#5A6B7D;--color-neutral-800:#3d3f40;--color-success:#4caf50;--color-error:#f44339;--font-display:'Satoshi',-apple-system,sans-serif;--font-body:'Instrument Sans',-apple-system,sans-serif;--font-data:'Geist',-apple-system,sans-serif;--bg-sidebar:#1c2333}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--color-neutral-050);color:var(--color-neutral-800);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased}
.sidebar{width:240px;flex-shrink:0;background:var(--bg-sidebar);color:#c8d0da;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.05);position:fixed;left:0;top:0;bottom:0;overflow-y:auto;z-index:100}
.sidebar-logo{height:64px;display:flex;align-items:center;padding:0 18px;gap:11px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo-mark{width:34px;height:34px;border-radius:8px;background:var(--color-primary);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:13px;font-weight:900;color:#fff;box-shadow:0 4px 12px rgba(0,87,184,.4)}
.logo-text{font-family:var(--font-display);font-size:14px;font-weight:700;color:#f0f4f8}
.logo-sub{font-size:9px;color:#6b7a8d;letter-spacing:.1em;margin-top:2px}
.nav-group{padding:14px 0 6px}
.nav-group-label{padding:6px 18px;font-family:var(--font-data);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6b7a8d}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 18px;cursor:pointer;color:#c8d0da;font-size:13px;text-decoration:none;transition:all .12s;position:relative}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.active{background:rgba(0,87,184,.22);color:#78b4ff}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--color-primary)}
.nav-item .ni{width:16px;flex-shrink:0;text-align:center;font-size:13px;opacity:.75}
.main{flex:1;margin-left:240px;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:52px;background:#fff;border-bottom:1px solid var(--color-neutral-200);display:flex;align-items:center;padding:0 28px;gap:14px;flex-shrink:0}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--color-neutral-400)}
.crumb a{color:var(--color-primary);text-decoration:none}.crumb .sep{opacity:.4}.crumb .now{color:var(--color-neutral-800);font-weight:600}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.version-pill{font-size:11px;font-family:var(--font-data);padding:3px 9px;border-radius:99px;background:rgba(0,135,90,.1);color:var(--color-accent);font-weight:600}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--color-primary);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;font-family:var(--font-display)}
.content{padding:32px 36px;flex:1}
.page-head{margin-bottom:22px}
.page-title{font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--color-neutral-800)}
.page-sub{font-size:13px;color:var(--color-neutral-400);margin-top:4px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat-card{background:#fff;border:1px solid var(--color-neutral-200);border-radius:10px;padding:16px 20px;position:relative}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--color-accent);border-radius:10px 10px 0 0}
.stat-card.green::before{background:var(--color-success)}.stat-card.dim::before{background:var(--color-neutral-400)}
.stat-label{font-size:12px;color:var(--color-neutral-400);margin-bottom:6px}.stat-value{font-family:var(--font-data);font-size:24px;font-weight:700;color:var(--color-neutral-800);font-feature-settings:'tnum'}.stat-unit{font-size:13px;color:var(--color-neutral-400);margin-left:4px}.stat-meta{font-size:11px;color:var(--color-neutral-400);margin-top:4px;font-family:var(--font-data)}
.toolbar{background:#fff;border:1px solid var(--color-neutral-200);border-radius:10px;padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:7px}.field label{font-size:12px;color:var(--color-neutral-600);font-weight:500}.field input,.field select{font-family:var(--font-body);font-size:12.5px;border:1px solid var(--color-neutral-200);border-radius:6px;padding:6px 10px;color:var(--color-neutral-800);background:#fff;outline:none;min-width:120px}
.spacer{flex:1}.btn{font-family:var(--font-body);font-size:13px;font-weight:500;padding:7px 14px;border-radius:6px;border:none;cursor:pointer}.btn-primary{background:var(--color-primary);color:#fff}.btn-ghost,.btn-secondary{background:#fff;color:var(--color-primary);border:1px solid var(--color-primary)}.btn-ghost{color:var(--color-neutral-600);border-color:var(--color-neutral-200)}
.table-wrap{background:#fff;border:1px solid var(--color-neutral-200);border-radius:10px;overflow:hidden;overflow-x:auto}.data-table{width:100%;border-collapse:collapse;min-width:1100px}.data-table th{background:var(--color-neutral-100);padding:11px 14px;font-size:11.5px;font-weight:700;color:var(--color-neutral-800);text-align:left;border-bottom:1px solid var(--color-neutral-200);white-space:nowrap;text-transform:uppercase}.data-table th.num{text-align:right}.data-table td{padding:10px 14px;font-size:12.5px;color:var(--color-neutral-800);border-bottom:1px solid var(--color-neutral-050);white-space:nowrap;vertical-align:middle}.data-table td.num{text-align:right;font-family:var(--font-data);font-feature-settings:'tnum'}.data-table td.code{font-family:var(--font-data);color:var(--color-primary);font-weight:500}.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#fff;border:1px solid var(--color-neutral-200);border-top:none;border-radius:0 0 10px 10px;font-size:12px;color:var(--color-neutral-600)}.pager-ctrl{display:flex;gap:4px}.pager-btn{padding:5px 10px;border:1px solid var(--color-neutral-200);border-radius:5px;background:#fff;cursor:pointer;font-size:12px;font-family:var(--font-data);color:var(--color-neutral-600)}.pager-btn.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}.pager-btn:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:32px;text-align:center;color:var(--color-neutral-400)}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="logo-mark">APS</div><div><div class="logo-text">高级计划排程</div><div class="logo-sub">MANUFACTURING · v1.0</div></div></div>
  <div class="nav-group"><div class="nav-group-label">导航</div><a href="index.html" class="nav-item"><span class="ni">◉</span>原型总览</a></div>
  <div class="nav-group"><div class="nav-group-label">工作台</div><a href="01-dashboard.html" class="nav-item"><span class="ni">◐</span>工作台</a></div>
  <div class="nav-group"><div class="nav-group-label">基础数据</div><a href="02-forecast-list.html" class="nav-item"><span class="ni">◇</span>入库需求数</a><a href="03-bom-list.html" class="nav-item"><span class="ni">▣</span>BOM 管理</a><a href="04-material-params.html" class="nav-item"><span class="ni">⊞</span>安全库存</a><a href="05-operating-days.html" class="nav-item"><span class="ni">◫</span>稼动天数</a><a href="06-inventory-count.html" class="nav-item"><span class="ni">▦</span>盘点数</a></div>
  <div class="nav-group"><div class="nav-group-label">生产计划</div><a href="07-plan-calculate.html" class="nav-item"><span class="ni">⚙</span>计划计算</a><a href="08-plan-result.html" class="nav-item active"><span class="ni">▤</span>计划结果</a></div>
</aside>
<div class="main">
  <div class="topbar">
    <div class="crumb"><a href="index.html">首页</a><span class="sep">/</span><span>生产计划</span><span class="sep">/</span><span class="now">计划结果</span></div>
    <div class="topbar-right"><span class="version-pill" id="resultVersionPill">未选择版本</span><div class="user-avatar">规</div></div>
  </div>
  <div class="content">
    <div class="page-head"><div class="page-title">计划结果</div><div class="page-sub">当前仅展示你选中的基础数据版本结果</div></div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">当前版本</div><div><span class="stat-value" id="statVersion" style="font-size:18px;font-weight:600">—</span></div><div class="stat-meta" id="statUpdated">—</div></div>
      <div class="stat-card"><div class="stat-label">计划行数</div><div><span class="stat-value" id="statTotal">0</span><span class="stat-unit">行</span></div><div class="stat-meta">按版本过滤后统计</div></div>
      <div class="stat-card green"><div class="stat-label">需生产</div><div><span class="stat-value" id="statNeed" style="color:var(--color-success)">0</span><span class="stat-unit">行</span></div><div class="stat-meta">占比 <span id="statNeedPct">0%</span></div></div>
      <div class="stat-card dim"><div class="stat-label">无需生产</div><div><span class="stat-value" id="statSkip" style="color:var(--color-neutral-400)">0</span><span class="stat-unit">行</span></div><div class="stat-meta">库存可满足或预测为 0</div></div>
    </div>
    <div class="toolbar">
      <div class="field"><label>版本</label><select id="filterVersion" onchange="onVersionChange()"></select></div>
      <div class="field"><label>期间</label><select id="filterPeriod" onchange="applyFilters()"><option value="">全部期间</option></select></div>
      <div class="field"><label>完成品</label><select id="filterProduct" onchange="applyFilters()"><option value="">全部完成品</option></select></div>
      <div class="field"><label>存货编码</label><input type="text" id="filterItemCode" placeholder="搜索编码" oninput="applyFilters()"></div>
      <div class="spacer"></div>
      <button class="btn btn-ghost" onclick="resetFilters()">重置</button>
    </div>
    <div class="toolbar" style="margin-bottom:16px"><div class="toolbar-left" id="toolbarLeft" style="font-size:13px;color:var(--color-neutral-600)">共 <b>0</b> 条计划记录</div><div class="spacer"></div></div>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>完成品</th><th>自制件编码</th><th>年月</th><th>工序</th><th>设备</th><th class="num">需求(毛)</th><th class="num">计划数量</th><th class="num">报废率</th><th class="num">安全天数</th><th class="num">当前库存</th><th>版本</th><th>是否生产</th></tr></thead><tbody id="dataTbody"><tr><td colspan="12" class="empty">加载中...</td></tr></tbody></table></div>
    <div class="pager" id="pager"><div class="pager-info" id="pagerInfo">—</div><div class="pager-ctrl" id="pagerCtrl"></div></div>
  </div>
</div>
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">计算明细 · <span id="dCode">—</span> · <span id="dPeriod">—</span></div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>
<script>
const API = location.origin;
const PAGE_SIZE = 18;
let allData = [];
let filtered = [];
let currentVersion = '';
let currentPage = 1;

function fmt(v,d=2){return v==null?'—':Number(v).toFixed(d)}
function pct(v){return v==null?'—':(v*100).toFixed(1)+'%'}

function getSelectedVersion(){
  return localStorage.getItem('aps.planVersion') || '';
}

function setVersionUI(version){
  const pill = document.getElementById('resultVersionPill');
  const stat = document.getElementById('statVersion');
  if (pill) pill.textContent = version || '未选择版本';
  if (stat) stat.textContent = version || '—';
}

async function loadVersions(){
  const res = await fetch(`${API}/api/production-plan/versions`).then(r=>r.json());
  const versions = res.data || [];
  const selected = getSelectedVersion() || versions[0] || '';
  const sel = document.getElementById('filterVersion');
  sel.innerHTML = versions.length ? versions.map(v=>`<option value="${v}">${v}</option>`).join('') : '<option value="">暂无版本</option>';
  if (selected && versions.includes(selected)) sel.value = selected;
  currentVersion = sel.value || versions[0] || '';
  if (!sel.value && currentVersion) sel.value = currentVersion;
  setVersionUI(currentVersion);
}

async function loadData(){
  await loadVersions();
  if (!currentVersion) {
    allData = [];
    render();
    return;
  }
  const res = await fetch(`${API}/api/production-plan/by-version/${encodeURIComponent(currentVersion)}`).then(r=>r.json());
  allData = res.data || [];
  populateFilters();
  applyFilters();
}

function populateFilters(){
  const periods = [...new Set(allData.map(d=>d.yearMonth))].sort((a,b)=>a-b);
  const products = [...new Set(allData.map(d=>d.finishedProductCode))].sort();
  const periodSel = document.getElementById('filterPeriod');
  const prodSel = document.getElementById('filterProduct');
  periodSel.innerHTML = '<option value="">全部期间</option>' + periods.map(p=>`<option value="${p}">${p}</option>`).join('');
  prodSel.innerHTML = '<option value="">全部完成品</option>' + products.map(p=>`<option value="${p}">${p}</option>`).join('');
}

function onVersionChange(){
  currentVersion = document.getElementById('filterVersion').value || '';
  localStorage.setItem('aps.planVersion', currentVersion);
  setVersionUI(currentVersion);
  loadData();
}

function applyFilters(){
  const period = document.getElementById('filterPeriod').value || '';
  const product = document.getElementById('filterProduct').value || '';
  const itemCode = (document.getElementById('filterItemCode').value || '').trim().toLowerCase();
  filtered = allData.filter(d => {
    if (period && String(d.yearMonth) !== period) return false;
    if (product && d.finishedProductCode !== product) return false;
    if (itemCode && !(d.itemCode || '').toLowerCase().includes(itemCode)) return false;
    return true;
  });
  currentPage = 1;
  render();
}

function resetFilters(){
  document.getElementById('filterPeriod').value = '';
  document.getElementById('filterProduct').value = '';
  document.getElementById('filterItemCode').value = '';
  filtered = allData.slice();
  currentPage = 1;
  render();
}

function render(){
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = total ? (currentPage - 1) * PAGE_SIZE : 0;
  const pageData = filtered.slice(start, start + PAGE_SIZE);
  const tbody = document.getElementById('dataTbody');
  if (!total) {
    tbody.innerHTML = '<tr><td colspan="12" class="empty">暂无数据，请先执行计划计算</td></tr>';
  } else {
    tbody.innerHTML = pageData.map(d => `
      <tr style="cursor:pointer" onclick='showDetailFromData(${JSON.stringify(d).replace(/'/g,"&apos;")})'>
        <td class="code">${d.finishedProductCode || '—'}</td>
        <td class="code">${d.itemCode || '—'}</td>
        <td>${d.yearMonth || '—'}</td>
        <td>${d.process || '—'}</td>
        <td>${d.equipment || '—'}</td>
        <td class="num">${fmt(d.forecast)}</td>
        <td class="num" style="font-weight:600;color:var(--color-primary)">${fmt(d.planQty)}</td>
        <td class="num">${d.scrapRate != null ? (d.scrapRate * 100).toFixed(1) + '%' : '—'}</td>
        <td class="num">${d.safetyDays ?? '—'}</td>
        <td class="num">${fmt(d.currentInventory)}</td>
        <td>${d.version || '—'}</td>
        <td>${d.isProduce === 'Y' ? '需生产' : '不生产'}</td>
      </tr>`).join('');
  }
  document.getElementById('toolbarLeft').innerHTML = `共 <b>${total}</b> 条计划记录`;
  document.getElementById('statTotal').textContent = total;
  const need = filtered.filter(d=>d.isProduce === 'Y').length;
  document.getElementById('statNeed').textContent = need;
  document.getElementById('statSkip').textContent = total - need;
  document.getElementById('statNeedPct').textContent = total ? ((need / total) * 100).toFixed(1) + '%' : '0%';
  document.getElementById('pagerInfo').textContent = total ? `显示 ${start + 1}-${Math.min(start + PAGE_SIZE, total)} / 共 ${total} 行` : '共 0 行';
  const ctrl = document.getElementById('pagerCtrl');
  const buttons = [];
  buttons.push(`<button class="pager-btn" ${currentPage===1?'disabled':''} onclick="gotoPage(${currentPage-1})">‹</button>`);
  for (let i = 1; i <= totalPages; i++) {
    buttons.push(`<button class="pager-btn ${i===currentPage?'active':''}" onclick="gotoPage(${i})">${i}</button>`);
  }
  buttons.push(`<button class="pager-btn" ${currentPage===totalPages?'disabled':''} onclick="gotoPage(${currentPage+1})">›</button>`);
  ctrl.innerHTML = buttons.join('');
}

function gotoPage(page){
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  currentPage = Math.min(Math.max(1, page), totalPages);
  render();
}

function closeModal(){
  document.getElementById('detailModal').classList.remove('show');
}

function showDetailFromData(d) {
  if (typeof d === 'string') {
    try { d = JSON.parse(d); } catch (e) { return; }
  }
  const inv = Number(d.currentInventory || 0);
  const demand = Number(d.forecast || 0);
  const safe = Number(d.safetyDays || 0);
  const scrap = Number(d.scrapRate || 0);
  const planQty = Number(d.planQty || 0);
  const gross = demand;
  const net = Math.max(0, gross - inv + safe);
  const endInv = Math.max(0, inv - gross) + planQty * (1 - scrap);
  const isFP = d.finishedProductCode === d.itemCode;

  document.getElementById('dCode').textContent = d.itemCode || '—';
  document.getElementById('dPeriod').textContent = d.yearMonth || '—';
  document.getElementById('detailBody').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px;margin-bottom:14px">
      <div><span style="color:var(--color-neutral-400)">完成品</span><br><b>${d.finishedProductCode || '—'}</b></div>
      <div><span style="color:var(--color-neutral-400)">${isFP ? '层级' : '存货编码'}</span><br><b>${isFP ? '完成品' : (d.itemCode || '—')}</b></div>
      <div><span style="color:var(--color-neutral-400)">期间</span><br><b>${d.yearMonth || '—'}</b></div>
      <div><span style="color:var(--color-neutral-400)">工序 / 设备</span><br><b>${d.process || '—'} / ${d.equipment || '—'}</b></div>
    </div>
    <div class="calc-step">毛需求 = <span class="ck">${fmt(gross,2)}</span></div>
    <div class="calc-step">当前库存 = <span class="ck">${fmt(inv,2)}</span></div>
    <div class="calc-step">安全库存 = <span class="ck">${fmt(safe,2)}</span></div>
    <div class="calc-step">净需求 = max(0, 毛需求 − 当前库存 + 安全库存) = <span class="res">${fmt(net,2)}</span></div>
    <div class="calc-step">计划数量 = ⌈净需求 ÷ (1 − 报废率)⌉ = <span class="res">${fmt(planQty,0)}</span></div>
    <div class="calc-formula">
      // 期末库存递推<br>
      期末库存 = max(0, 当前库存 − 毛需求) + 计划产出 × (1 − 报废率)<br>
      &nbsp;&nbsp;= max(0, <span style="color:#ffcb70">${fmt(inv,2)}</span> − <span style="color:#ffcb70">${fmt(gross,2)}</span>) + <span style="color:#ffcb70">${fmt(planQty,0)}</span> × (1 − <span style="color:#ffcb70">${pct(scrap)}</span>)<br>
      &nbsp;&nbsp;= <span style="color:#7be3a8;font-weight:700">${fmt(endInv,2)}</span>
    </div>`;
  document.getElementById('detailModal').classList.add('show');
}

document.getElementById('detailModal').addEventListener('click', e => {
  if (e.target && e.target.id === 'detailModal') closeModal();
});

loadData().catch(err => {
  console.error(err);
  document.getElementById('dataTbody').innerHTML = '<tr><td colspan="12" class="empty">加载失败，请确认后端服务已启动</td></tr>';
});
</script>
</body>
</html>
