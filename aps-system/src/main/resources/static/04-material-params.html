<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>APS · 物料参数</title>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=satoshi:400,500,700,900|instrument-sans:400,500,600|geist:400,500,600,700&display=swap" rel="stylesheet"/>
<style>
:root{
  --color-primary:#0057b8;--color-secondary:#FF6B35;--color-accent:#00875A;
  --color-neutral-050:#f1f2f3;--color-neutral-100:#fafbfc;--color-neutral-200:#c1c6c8;
  --color-neutral-400:#8A96A8;--color-neutral-600:#5A6B7D;--color-neutral-800:#3d3f40;
  --color-success:#4caf50;--color-warning:#fbc02d;--color-error:#f44339;--color-info:#03a9f4;
  --font-display:'Satoshi',-apple-system,sans-serif;
  --font-body:'Instrument Sans',-apple-system,sans-serif;
  --font-data:'Geist',-apple-system,sans-serif;
  --bg-sidebar:#1c2333;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--color-neutral-050);color:var(--color-neutral-800);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased}

.sidebar{width:240px;flex-shrink:0;background:var(--bg-sidebar);color:#c8d0da;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.05);position:fixed;left:0;top:0;bottom:0;overflow-y:auto;z-index:100}
.sidebar-logo{height:64px;display:flex;align-items:center;padding:0 18px;gap:11px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo-mark{width:34px;height:34px;border-radius:8px;background:var(--color-primary);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:13px;font-weight:900;color:#fff;box-shadow:0 4px 12px rgba(0,87,184,.4)}
.logo-text{font-family:var(--font-display);font-size:14px;font-weight:700;color:#f0f4f8}
.logo-sub{font-size:9px;color:#6b7a8d;letter-spacing:.1em;margin-top:2px}
.nav-group{padding:14px 0 6px}
.nav-group-label{padding:6px 18px;font-family:var(--font-data);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6b7a8d}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 18px;cursor:pointer;color:#c8d0da;font-size:13px;text-decoration:none;transition:all .12s;position:relative}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.active{background:rgba(0,87,184,.22);color:#78b4ff}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--color-primary)}
.nav-item .ni{width:16px;flex-shrink:0;text-align:center;font-size:13px;opacity:.75}
.nav-item.active .ni{opacity:1}

.main{flex:1;margin-left:240px;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:52px;background:#fff;border-bottom:1px solid var(--color-neutral-200);display:flex;align-items:center;padding:0 28px;gap:14px;flex-shrink:0}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--color-neutral-400)}
.crumb a{color:var(--color-primary);text-decoration:none}
.crumb a:hover{text-decoration:underline}
.crumb .sep{opacity:.4}
.crumb .now{color:var(--color-neutral-800);font-weight:600}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.version-pill{font-size:11px;font-family:var(--font-data);padding:3px 9px;border-radius:99px;background:rgba(0,135,90,.1);color:var(--color-accent);font-weight:600;letter-spacing:.04em}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--color-primary);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;font-family:var(--font-display)}

.content{padding:32px 36px;flex:1}
.page-head{margin-bottom:24px}
.page-title{font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--color-neutral-800);letter-spacing:-.4px}
.page-sub{font-size:13px;color:var(--color-neutral-400);margin-top:4px}

.tabs{display:flex;gap:4px;background:var(--color-neutral-100);border:1px solid var(--color-neutral-200);border-radius:8px;padding:4px;width:fit-content;margin-bottom:18px}
.tab{padding:8px 18px;font-size:13px;color:var(--color-neutral-600);cursor:pointer;border-radius:5px;font-weight:500;transition:all .15s}
.tab:hover{color:var(--color-neutral-800)}
.tab.active{background:#fff;color:var(--color-primary);box-shadow:0 1px 3px rgba(0,0,0,.06)}

.filter-bar{background:#fff;border:1px solid var(--color-neutral-200);border-radius:10px;padding:14px 18px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.filter-group{display:flex;flex-direction:column;gap:5px}
.filter-label{font-size:11px;color:var(--color-neutral-400)}
.filter-input,.filter-select{padding:7px 10px;border:1px solid var(--color-neutral-200);border-radius:6px;font-size:13px;font-family:var(--font-body);min-width:140px;background:#fff}
.filter-input:focus,.filter-select:focus{outline:none;border-color:var(--color-primary)}
.filter-actions{margin-left:auto;display:flex;gap:8px}

.btn{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.btn-primary:hover{background:#004a9e}
.btn-secondary{background:#fff;color:var(--color-primary);border-color:var(--color-primary)}
.btn-secondary:hover{background:rgba(0,87,184,.05)}
.btn-ghost{background:transparent;color:var(--color-neutral-600);border-color:var(--color-neutral-200)}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.toolbar-left{font-size:13px;color:var(--color-neutral-600)}
.toolbar-right{display:flex;gap:8px}

.data-panel{background:#fff;border:1px solid var(--color-neutral-200);border-radius:10px;overflow:hidden}
.data-table{width:100%;border-collapse:collapse}
.data-table th{background:var(--color-neutral-100);padding:11px 14px;font-size:11px;font-weight:600;color:var(--color-neutral-400);text-align:left;border-bottom:1px solid var(--color-neutral-200);text-transform:uppercase;letter-spacing:.05em}
.data-table th.num{text-align:right}
.data-table td{padding:11px 14px;font-size:13px;color:var(--color-neutral-800);border-bottom:1px solid var(--color-neutral-050)}
.data-table td.num{text-align:right;font-family:var(--font-data);font-feature-settings:'tnum';font-weight:500}
.data-table td.code{font-family:var(--font-data);font-size:12.5px;color:var(--color-neutral-600)}
.data-table tr:hover td{background:var(--color-neutral-100)}

.action-link{color:var(--color-primary);font-size:12.5px;cursor:pointer;text-decoration:none}
.action-link:hover{text-decoration:underline}
.action-link.danger{color:var(--color-error)}
.act-sep{color:var(--color-neutral-200);margin:0 6px}

/* visual rate bar */
.rate-cell{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.rate-bar{width:60px;height:5px;background:var(--color-neutral-100);border-radius:3px;overflow:hidden;position:relative}
.rate-bar-fill{height:100%;background:var(--color-accent);border-radius:3px}
.rate-bar-fill.warn{background:var(--color-warning)}
.rate-bar-fill.high{background:var(--color-error)}
.rate-val{font-family:var(--font-data);font-feature-settings:'tnum';font-weight:600;min-width:42px;text-align:right}

.day-cell{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.day-pill{font-family:var(--font-data);font-weight:600;font-size:12px;padding:2px 7px;border-radius:5px;background:var(--color-neutral-100);color:var(--color-neutral-600);min-width:36px;text-align:center}
.day-pill.safety{background:rgba(0,135,90,.12);color:var(--color-accent)}
.day-pill.max{background:rgba(255,107,53,.12);color:#d35a26}

/* modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:12px;padding:28px 32px;width:420px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.modal-title{font-family:var(--font-display);font-size:17px;font-weight:700;margin-bottom:20px}
.modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--color-neutral-400);margin-top:-4px}
.form-group{margin-bottom:16px}
.form-label{font-size:12px;color:var(--color-neutral-400);margin-bottom:5px;display:block}
.form-input{width:100%;padding:9px 11px;border:1px solid var(--color-neutral-200);border-radius:6px;font-size:13px;font-family:var(--font-body)}
.form-input:focus{outline:none;border-color:var(--color-primary)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}

/* toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#323c4d;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>

  <div class="sidebar-logo">
    <div class="logo-mark">APS</div>
    <div><div class="logo-text">高级计划排程</div><div class="logo-sub">MANUFACTURING · v1.0</div></div>
  </div>
  <div class="nav-group"><div class="nav-group-label">导航</div><a href="index.html" class="nav-item"><span class="ni">◉</span>原型总览</a></div>

<div class="main">
  <div class="topbar">
    <div class="crumb"><a href="index.html">首页</a><span class="sep">/</span><a href="#">基础数据</a><span class="sep">/</span><span class="now">物料参数</span></div>
    <div class="topbar-right">
      <span class="version-pill">v1.0 · 2026-05 正式版</span>
      <div class="user-avatar">规</div>
    </div>
  </div>

  <div class="content">
    <div class="page-head">
      <div class="page-title">物料参数</div>
      <div class="page-sub">报废率与库存天数等物料级别计算参数</div>
    </div>

    <div class="tabs">
      <div class="tab active" id="tab-scrap" onclick="switchTab('scrap')">报废率</div>
      <div class="tab" id="tab-stock" onclick="switchTab('stock')">库存天数</div>
    </div>

    <!-- 报废率 -->
    <div id="view-scrap">
      <div class="filter-bar">
        <div class="filter-group">
          <label class="filter-label">存货编码</label>
          <input class="filter-input" placeholder="如 11201A012">
        </div>
        <div class="filter-group">
          <label class="filter-label">物料名称</label>
          <input class="filter-input" placeholder="模糊搜索">
        </div>
        <div class="filter-actions">
          <button class="btn btn-secondary">重置</button>
          <button class="btn btn-primary">查询</button>
        </div>
      </div>

      <div class="toolbar">
        <div class="toolbar-left" id="scrapCount">共 <b style="font-family:var(--font-data);color:var(--color-neutral-800)">0</b> 条记录</div>
        <div class="toolbar-right">
          <button class="btn btn-secondary" onclick="openScrapModal()">+ 新增</button>
          <button class="btn btn-ghost">⇩ 导出</button>
        </div>
      </div>

      <div class="data-panel">
        <table class="data-table">
          <thead>
            <tr>
              <th>存货编码</th><th>物料名称</th>
              <th class="num">报废率</th>
              <th>最后更新时间</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="scrapTbody">
          </tbody>
        </table>
      </div>
    </div>

    <!-- 库存天数 -->
    <div id="view-stock" hidden>
      <div class="filter-bar">
        <div class="filter-group">
          <label class="filter-label">存货编码</label>
          <input class="filter-input" placeholder="如 11201A012">
        </div>
        <div class="filter-actions">
          <button class="btn btn-secondary">重置</button>
          <button class="btn btn-primary">查询</button>
        </div>
      </div>

      <div class="toolbar">
        <div class="toolbar-left" id="invDaysCount">共 <b style="font-family:var(--font-data);color:var(--color-neutral-800)">0</b> 条记录</div>
        <div class="toolbar-right">
          <button class="btn btn-secondary" onclick="openInvDaysModal()">+ 新增</button>
          <button class="btn btn-ghost">⇩ 导出</button>
        </div>
      </div>

      <div class="data-panel">
        <table class="data-table">
          <thead>
            <tr>
              <th>存货编码</th><th>物料名称</th>
              <th class="num">安全天数</th><th class="num">最大天数</th>
              <th>最后更新时间</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="invDaysTbody">
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 报废率 新增/编辑 弹窗 -->
<div class="modal-overlay" id="scrapModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('scrapModal')">×</button>
    <div class="modal-title" id="scrapModalTitle">新增报废率</div>
    <input type="hidden" id="scrapId">
    <div class="form-group">
      <label class="form-label">存货编码 *</label>
      <input class="form-input" id="scrapItemCode" placeholder="如 11201A012">
    </div>
    <div class="form-group">
      <label class="form-label">报废率（%）*</label>
      <input class="form-input" id="scrapRate" type="number" step="0.01" min="0" max="100" placeholder="如 1.5">
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('scrapModal')">取消</button>
      <button class="btn btn-primary" onclick="saveScrap()">保存</button>
    </div>
  </div>
</div>

<!-- 库存天数 新增/编辑 弹窗 -->
<div class="modal-overlay" id="invDaysModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('invDaysModal')">×</button>
    <div class="modal-title" id="invDaysModalTitle">新增库存天数</div>
    <input type="hidden" id="invDaysId">
    <div class="form-group">
      <label class="form-label">存货编码 *</label>
      <input class="form-input" id="invDaysItemCode" placeholder="如 11201A012">
    </div>
    <div class="form-group">
      <label class="form-label">安全天数 *</label>
      <input class="form-input" id="invDaysSafety" type="number" step="0.5" min="0" placeholder="如 3">
    </div>
    <div class="form-group">
      <label class="form-label">最大天数</label>
      <input class="form-input" id="invDaysMax" type="number" step="0.5" min="0" placeholder="如 30">
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('invDaysModal')">取消</button>
      <button class="btn btn-primary" onclick="saveInvDays()">保存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
function switchTab(view){
  document.getElementById('tab-scrap').classList.toggle('active', view==='scrap');
  document.getElementById('tab-stock').classList.toggle('active', view==='stock');
  document.getElementById('view-scrap').hidden = view!=='scrap';
  document.getElementById('view-stock').hidden = view!=='stock';
}

const API = 'http://localhost:8080';

// ── Toast ──────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Modal helpers ──────────────────────────────────────
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

// ── Load ───────────────────────────────────────────────
async function loadData() {
  const [r1, r2] = await Promise.all([
    fetch(`${API}/api/scrap-rate`).then(r=>r.json()),
    fetch(`${API}/api/inventory-days`).then(r=>r.json())
  ]);
  renderScrapRates(r1.data || []);
  renderInventoryDays(r2.data || []);
}

// ── 报废率 渲染 ────────────────────────────────────────
function renderScrapRates(data) {
  const tbody = document.getElementById('scrapTbody');
  const cnt   = document.getElementById('scrapCount');
  if (!tbody) return;
  if (cnt) cnt.innerHTML = `共 <b style="font-family:var(--font-data);color:var(--color-neutral-800)">${data.length}</b> 条记录`;
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--color-neutral-400)">暂无数据</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(d => {
    const pct  = ((d.scrapRate || 0) * 100).toFixed(2);
    const barW = Math.min(pct * 10, 100);
    return `<tr>
      <td class="code">${d.itemCode}</td>
      <td>${d.itemCode}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:80px;height:6px;background:var(--color-neutral-200);border-radius:3px;overflow:hidden">
            <div style="width:${barW}%;height:100%;background:var(--color-primary);border-radius:3px"></div>
          </div>
          <span style="font-family:var(--font-data);font-size:12.5px">${pct}%</span>
        </div>
      </td>
      <td>—</td>
      <td>
        <a class="action-link" onclick='openScrapModal(${JSON.stringify(d)})'>编辑</a>
        <span class="act-sep">|</span>
        <a class="action-link danger" onclick="deleteScrap(${d.id})">删除</a>
      </td>
    </tr>`;
  }).join('');
}

// ── 库存天数 渲染 ──────────────────────────────────────
function renderInventoryDays(data) {
  const tbody = document.getElementById('invDaysTbody');
  const cnt   = document.getElementById('invDaysCount');
  if (!tbody) return;
  if (cnt) cnt.innerHTML = `共 <b style="font-family:var(--font-data);color:var(--color-neutral-800)">${data.length}</b> 条记录`;
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--color-neutral-400)">暂无数据</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(d => `
    <tr>
      <td class="code">${d.itemCode}</td>
      <td>${d.itemCode}</td>
      <td class="num"><span style="background:rgba(0,87,184,.1);color:var(--color-primary);padding:2px 8px;border-radius:5px;font-family:var(--font-data)">${d.safetyDays ?? '—'} 天</span></td>
      <td class="num"><span style="background:rgba(0,135,90,.1);color:var(--color-accent);padding:2px 8px;border-radius:5px;font-family:var(--font-data)">${d.maxDays ?? '—'} 天</span></td>
      <td>—</td>
      <td>
        <a class="action-link" onclick='openInvDaysModal(${JSON.stringify(d)})'>编辑</a>
        <span class="act-sep">|</span>
        <a class="action-link danger" onclick="deleteInvDays(${d.id})">删除</a>
      </td>
    </tr>`).join('');
}

// ── 报废率 新增/编辑 ───────────────────────────────────
function openScrapModal(d) {
  document.getElementById('scrapModalTitle').textContent = d ? '编辑报废率' : '新增报废率';
  document.getElementById('scrapId').value       = d ? d.id : '';
  document.getElementById('scrapItemCode').value = d ? d.itemCode : '';
  document.getElementById('scrapRate').value     = d ? ((d.scrapRate || 0) * 100).toFixed(2) : '';
  document.getElementById('scrapItemCode').disabled = !!d;
  document.getElementById('scrapModal').classList.add('show');
}

async function saveScrap() {
  const id       = document.getElementById('scrapId').value;
  const itemCode = document.getElementById('scrapItemCode').value.trim();
  const ratePct  = parseFloat(document.getElementById('scrapRate').value);
  if (!itemCode) { showToast('请输入存货编码'); return; }
  if (isNaN(ratePct) || ratePct < 0 || ratePct > 100) { showToast('报废率须在 0~100 之间'); return; }
  const body = { itemCode, scrapRate: ratePct / 100 };
  const url    = id ? `${API}/api/scrap-rate/${id}` : `${API}/api/scrap-rate`;
  const method = id ? 'PUT' : 'POST';
  const r = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const j = await r.json();
  if (j.code === 200) {
    showToast(id ? '修改成功' : '新增成功');
    closeModal('scrapModal');
    loadData();
  } else {
    showToast(j.message || '保存失败');
  }
}

async function deleteScrap(id) {
  if (!confirm('确认删除该报废率记录？')) return;
  await fetch(`${API}/api/scrap-rate/${id}`, { method:'DELETE' });
  showToast('已删除');
  loadData();
}

// ── 库存天数 新增/编辑 ─────────────────────────────────
function openInvDaysModal(d) {
  document.getElementById('invDaysModalTitle').textContent = d ? '编辑库存天数' : '新增库存天数';
  document.getElementById('invDaysId').value       = d ? d.id : '';
  document.getElementById('invDaysItemCode').value = d ? d.itemCode : '';
  document.getElementById('invDaysSafety').value   = d ? (d.safetyDays ?? '') : '';
  document.getElementById('invDaysMax').value      = d ? (d.maxDays ?? '') : '';
  document.getElementById('invDaysItemCode').disabled = !!d;
  document.getElementById('invDaysModal').classList.add('show');
}

async function saveInvDays() {
  const id         = document.getElementById('invDaysId').value;
  const itemCode   = document.getElementById('invDaysItemCode').value.trim();
  const safetyDays = parseFloat(document.getElementById('invDaysSafety').value);
  const maxDays    = document.getElementById('invDaysMax').value !== '' ? parseFloat(document.getElementById('invDaysMax').value) : null;
  if (!itemCode) { showToast('请输入存货编码'); return; }
  if (isNaN(safetyDays) || safetyDays < 0) { showToast('安全天数须为非负数'); return; }
  const body = { itemCode, safetyDays, maxDays };
  const url    = id ? `${API}/api/inventory-days/${id}` : `${API}/api/inventory-days`;
  const method = id ? 'PUT' : 'POST';
  const r = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const j = await r.json();
  if (j.code === 200) {
    showToast(id ? '修改成功' : '新增成功');
    closeModal('invDaysModal');
    loadData();
  } else {
    showToast(j.message || '保存失败');
  }
}

async function deleteInvDays(id) {
  if (!confirm('确认删除该库存天数记录？')) return;
  await fetch(`${API}/api/inventory-days/${id}`, { method:'DELETE' });
  showToast('已删除');
  loadData();
}

loadData();
</script>
